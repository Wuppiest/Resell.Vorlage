<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinted Schablone</title>
<style>
:root{
  --bg:#eef0f0;--panel:#fff;--ink:#171c1d;--mute:#6b7578;--line:#dadfe0;--soft:#f4f6f6;
  --acc:#0b6e75;--accInk:#fff;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -14px rgba(0,0,0,.18);
  --ease:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121516;--panel:#1a1e1f;--ink:#e8eced;--mute:#8e999c;--line:#2b3234;--soft:#222829;
  --acc:#4fb3b9;--accInk:#0a1415;--shadow:0 8px 24px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --bg:#121516;--panel:#1a1e1f;--ink:#e8eced;--mute:#8e999c;--line:#2b3234;--soft:#222829;
  --acc:#4fb3b9;--accInk:#0a1415;--shadow:0 8px 24px -14px rgba(0,0,0,.6)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif;background:var(--bg)}
.app{display:grid;grid-template-columns:320px 1fr;gap:28px;padding:28px;max-width:1280px;margin:0 auto}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:18px;align-self:start;box-shadow:var(--shadow);animation:rise .6s var(--ease) both}
.stage{animation:rise .6s .08s var(--ease) both;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.drop{border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--mute);background:var(--soft);
  border:1.5px dashed var(--line);transition:border-color .25s,background .25s,color .25s}
.drop svg{display:block;margin:0 auto 8px;color:var(--acc);transition:transform .35s var(--ease)}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--ink)}
.drop:hover svg,.drop.over svg{transform:translateY(-2px)}
label.l{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;font-weight:600}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;transition:border-color .2s}
input[type=text]:focus{outline:none;border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.seg{position:relative;display:grid;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:7px;background:var(--acc);transition:transform .3s var(--ease)}
.seg button{position:relative;z-index:1;background:none;border:0;color:var(--mute);padding:7px 0;font:inherit;font-size:13px;cursor:pointer;border-radius:7px;transition:color .25s}
.seg button.on{color:var(--accInk);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:10px 14px;transition:border-color .2s,filter .2s,transform .15s}
.btn:hover{border-color:var(--mute)}
.btn:active{transform:scale(.99)}
.btn.pri{background:var(--acc);color:var(--accInk);border:0;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.err{font-size:13px;color:#d4493a}
.err:empty{display:none}
.hint{font-size:12px;color:var(--mute)}
.edit{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;animation:rise .35s var(--ease) both}
.edit .hd{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.edit .hd small{color:var(--mute);font-weight:400}
.crow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.crow .top{display:flex;align-items:center;gap:6px}
.crow .top b{font-size:13px;flex:1}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--mute);border-radius:8px;width:28px;padding:4px 0;font:inherit;font-size:13px;cursor:pointer;transition:background .2s,color .2s}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.crow select{padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:inherit;font-size:13px}
.crow input[type=text]{padding:7px 10px;font-size:14px}
.xb{border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.xb:hover{color:var(--ink)}
.btn:disabled{opacity:.6;cursor:progress}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--acc)}
.bar span{font-size:13px;color:var(--mute)}
.cvwrap{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#fff;line-height:0;border:1px solid var(--line)}
.fi{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
canvas{width:100%;height:auto;display:block;touch-action:pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);transform:translateY(18px) scale(.96);transition:transform .35s var(--ease)}
.ov.on .modal{transform:none}
.pvbox{background:var(--soft);border-radius:12px;height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pvbox img{max-width:100%;max-height:100%;transition:opacity .25s,transform .35s var(--ease)}
.pvbox img.sw{opacity:0;transform:scale(.96)}
.q{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.q small{font-weight:400;color:var(--mute)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;opacity:0;transition:border-color .2s}
.ov.on .opt{animation:rise .4s var(--ease) both}
.opt:hover{border-color:var(--acc)}
.opt svg{flex:none;color:var(--acc)}
.opt em{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .4s var(--ease);z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div><h1>Vinted-Schablone</h1><div class="sub">Fotos rein, Übersichtsbild raus.</div></div>
    <div class="drop" id="drop" tabindex="0" role="button">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
      Bilder hierher ziehen<br>oder klicken
    </div>
    <input type="file" id="file" class="fi" accept="image/*" multiple tabindex="-1" aria-hidden="true">
    <div class="err" id="err"></div>

    <div><label class="l">Layout</label><div class="seg" id="segLayout" style="grid-template-columns:repeat(5,1fr)"></div></div>

    <div class="edit" id="cust" hidden>
      <div class="hd"><span>Eigenes Layout</span><small>max. 12 Felder</small></div>
      <div id="crows" style="display:flex;flex-direction:column;gap:10px"></div>
      <button class="btn sm" id="addRow">+ Zeile hinzufügen</button>
    </div>

    <div class="edit" id="edit" hidden>
      <div class="hd"><span id="eName"></span><small id="eZ"></small></div>
      <input type="range" id="zoom" min="30" max="400" value="100" aria-label="Zoom">
      <div class="seg" id="segFit" style="grid-template-columns:repeat(2,1fr)"></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label class="l" style="margin:0">Hintergrund</label>
        <button class="btn sm" id="bgBtn">Hintergrund entfernen</button>
        <div class="seg" id="segBg" hidden style="grid-template-columns:repeat(2,1fr)"></div>
        <div class="hint" id="bgInfo"></div>
      </div>
      <div class="two">
        <button class="btn sm" id="eRepl">Ersetzen</button>
        <button class="btn sm" id="eView">Zurücksetzen</button>
      </div>
      <button class="btn sm ghost" id="eDel">Bild entfernen</button>
      <div class="hint">Im Bild ziehen = verschieben, Mausrad = zoomen.</div>
    </div>

    <div id="titleBox"><label class="l" for="title">Titel</label><input type="text" id="title" value="Vinted-Ready Product Overview"></div>
    <div><label class="l">Format</label><div class="seg" id="segFmt" style="grid-template-columns:repeat(2,1fr)"></div></div>
    <div><label class="l">Breite</label><div class="seg" id="segSize" style="grid-template-columns:repeat(3,1fr)"></div></div>
    <button class="btn pri" id="export">Exportieren</button>
    <button class="btn ghost" id="reset">Alles leeren</button>
  </div>
  <div class="stage">
    <div class="bar"><div class="dots" id="dots"></div><span id="stat"></span></div>
    <div class="cvwrap"><canvas id="cv" width="1000" height="1333"></canvas></div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Bild zuordnen">
    <div class="pvbox"><img id="pv" alt=""></div>
    <div class="q"><span>Wohin damit?</span><small id="cnt"></small></div>
    <div class="opts" id="opts"></div>
    <button class="btn ghost" id="skip">Überspringen</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var $=function(id){return document.getElementById(id)};
var SLOTS=[
  {key:'front',name:'Front',sub:'Vorderseite',label:'FRONT VIEW',fit:'contain'},
  {key:'back',name:'Back',sub:'Rückseite',label:'BACK VIEW',fit:'contain'},
  {key:'print',name:'Logo / Print',sub:'Detail',label:'LOGO / PRINT',fit:'cover'},
  {key:'label',name:'Etikett',sub:'Größe & Material',label:'INSIDE LABELS & SIZE',fit:'cover'},
  {key:'defect',name:'Defekte',sub:'Flecken, Risse',label:'DEFECTS',fit:'cover'},
  {key:'detail',name:'Detail',sub:'Extra',label:'DETAIL',fit:'cover'},
  {key:'photo',name:'Foto',sub:'Einzelbild',label:'',fit:'contain'}
];
var LAYOUTS={
  grid4:{rows:[{h:1,c:['front','back']},{h:1,c:['print','label']}]},
  hero:{rows:[{h:1.5,c:['front']},{h:1,c:['back','print','label']}]},
  grid6:{rows:[{h:1,c:['front','back']},{h:1,c:['print','label']},{h:1,c:['defect','detail']}]},
  custom:{rows:[]},
  foto:{bare:true,rows:[{h:1,c:['photo']}]}
};
var cur='grid4', imgs={}, view={}, born={}, hover='', sel='', drag=null;
var nk=0, customInit=false;
var cut={}, useCut={}, busy={}, bgMsg={}, bgBuilt='';
function clearCut(k){cut[k]=null;useCut[k]=false;bgMsg[k]='';bgBuilt=''}
var pending=[], total=0, replaceKey=null, fmt='png', size=1800, editKey='';
var cv=$('cv'), ctx=cv.getContext('2d');
var FONT='"Segoe UI",Helvetica,Arial,sans-serif';
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function slot(k){return SLOTS.filter(function(s){return s.key===k})[0]}
function resetView(k){view[k]={z:1,x:0,y:0}}
SLOTS.forEach(function(s){imgs[s.key]=null;resetView(s.key)});

function rects(id,W,H,u,minGap){
  var L=LAYOUTS[id],bare=!!L.bare,gap=bare?0:Math.max(minGap,Math.round(4*u)),titleH=bare?0:Math.round(100*u),barH=bare?0:Math.round(90*u);
  var area=H-titleH,sum=0,out=[];
  L.rows.forEach(function(r){sum+=r.h});
  var y=titleH;
  L.rows.forEach(function(r,ri){
    var rh=area*r.h/sum,h=rh-(ri<L.rows.length-1?gap:0),n=r.c.length,cw=(W-gap*(n-1))/n;
    r.c.forEach(function(k,i){
      var x=i*(cw+gap);
      out.push({key:k,x:x,y:y,w:cw,h:h,barH:barH,iy:y+barH+gap,ih:h-barH-gap});
    });
    y+=rh;
  });
  return {c:out,titleH:titleH};
}
function inLayout(k){return LAYOUTS[cur].rows.some(function(r){return r.c.indexOf(k)>=0})}
function curImg(k){return useCut[k]&&cut[k]?cut[k]:imgs[k]}
function ease(t){return 1-Math.pow(1-t,3)}

function drawImg(k,img,x,y,w,h,p){
  var v=view[k],fit=slot(k).fit;
  var b=fit==='cover'?Math.max(w/img.width,h/img.height):Math.min(w/img.width,h/img.height);
  var s=b*v.z*(1+0.06*(1-p)),iw=img.width*s,ih=img.height*s;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.globalAlpha=p;
  ctx.drawImage(img,x+w/2+v.x*w-iw/2,y+h/2+v.y*h-ih/2,iw,ih);
  ctx.restore();
}
function fitText(t,maxW,px,font){
  ctx.font=px+'px '+FONT;
  while(ctx.measureText(t).width>maxW&&px>8){px--;ctx.font=px+'px '+FONT}
}
function render(W,preview){
  var H=Math.round(W*4/3),u=W/1800,now=performance.now(),busy=false;
  cv.width=W;cv.height=H;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  var g=rects(cur,W,H,u,2),bare=!!LAYOUTS[cur].bare;
  if(!bare){
    ctx.fillStyle='#111';fitText($('title').value,W*.9,Math.round(46*u));
    ctx.fillText($('title').value,W/2,g.titleH/2);
  }
  g.c.forEach(function(c){
    var s=slot(c.key);
    if(!bare){
      ctx.fillStyle='#efefef';ctx.fillRect(c.x,c.y,c.w,c.barH);
      ctx.fillStyle='#111';fitText(s.label,c.w*.9,Math.round(34*u));
      ctx.fillText(s.label,c.x+c.w/2,c.y+c.barH/2);
    }
    ctx.fillStyle=bare?'#fff':'#e8e8e8';ctx.fillRect(c.x,c.iy,c.w,c.ih);
    var im=imgs[c.key];
    if(im){
      var p=1;
      if(preview&&born[c.key]&&!reduce){p=Math.min(1,(now-born[c.key])/550);if(p<1)busy=true;p=ease(p)}
      drawImg(c.key,curImg(c.key),c.x,c.iy,c.w,c.ih,p);
    }else if(preview){
      var cx=c.x+c.w/2,cy=c.iy+c.ih/2,q=Math.min(c.w,c.ih)/500,r=60*q*u*1.8;
      ctx.strokeStyle='#a9b3b4';ctx.lineWidth=Math.max(2,4*q*u*1.8);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx-r/2,cy-r*.5);ctx.lineTo(cx+r/2,cy-r*.5);ctx.moveTo(cx,cy-r);ctx.lineTo(cx,cy);ctx.stroke();
      ctx.fillStyle='#8c9899';fitText(s.name,c.w*.8,Math.round(30*q*u*1.8));
      ctx.fillText(s.name,cx,cy+r*.8);
    }
    if(preview&&(hover===c.key||sel===c.key)){
      ctx.strokeStyle=sel===c.key?'#0b6e75':'rgba(11,110,117,.5)';
      ctx.lineWidth=4*u;ctx.strokeRect(c.x+2*u,c.y+2*u,c.w-4*u,c.h-4*u);
    }
  });
  return busy;
}
var raf=0;
function draw(){
  updateStat();
  if(raf)return;
  (function loop(){
    var busy=render(1000,true);
    raf=busy?requestAnimationFrame(loop):0;
  })();
}
function updateStat(){
  var ks=rects(cur,100,100,.05,1).c.map(function(c){return c.key}),n=0,d=$('dots');
  if(d.children.length!==ks.length){d.innerHTML='';ks.forEach(function(){d.appendChild(document.createElement('i'))})}
  ks.forEach(function(k,i){var on=!!imgs[k];if(on)n++;d.children[i].className=on?'on':''});
  $('stat').textContent=n+' von '+ks.length+' Feldern';
}
function setImg(k,im){imgs[k]=im;clearCut(k);resetView(k);born[k]=performance.now();sel=k;syncEdit();draw()}

/* Segmented Controls */
function seg(id,opts,val,cb){
  var el=$(id);el.innerHTML='<div class="pill"></div>';
  var pill=el.firstChild;pill.style.width='calc((100% - 6px) / '+opts.length+')';
  opts.forEach(function(o,i){
    var b=document.createElement('button');b.textContent=o[1];if(o[0]===val)b.className='on';
    b.onclick=function(){
      [].forEach.call(el.querySelectorAll('button'),function(x){x.className=''});b.className='on';
      pill.style.transform='translateX('+(i*100)+'%)';cb(o[0]);
    };
    el.appendChild(b);
    if(o[0]===val)pill.style.transform='translateX('+(i*100)+'%)';
  });
}
seg('segFmt',[['png','PNG'],['jpg','JPG']],'png',function(v){fmt=v});
seg('segSize',[[1200,'1200'],[1800,'1800'],[2400,'2400']],1800,function(v){size=v});
seg('segLayout',[['grid4','2×2'],['hero','1 + 3'],['grid6','6er'],['custom','Eigen'],['foto','Foto']],'grid4',function(v){
  if(v==='custom'&&!customInit)initCustom();
  cur=v;hover='';if(sel&&!inLayout(sel))sel='';
  $('titleBox').hidden=v==='foto';
  $('cust').hidden=v!=='custom';if(v==='custom')buildCust();
  var n=performance.now();Object.keys(imgs).forEach(function(k){if(imgs[k])born[k]=n});
  syncEdit();draw();
});

/* Eigenes Layout */
function newSlot(title,fit){var k='c'+(++nk);SLOTS.push({key:k,name:title,sub:'Eigenes Feld',label:title,fit:fit||'cover'});imgs[k]=null;resetView(k);return k}
function dropSlot(k){
  var i=SLOTS.map(function(x){return x.key}).indexOf(k);if(i>=0)SLOTS.splice(i,1);
  delete imgs[k];delete view[k];delete born[k];delete cut[k];delete useCut[k];delete bgMsg[k];
  if(sel===k)sel='';if(hover===k)hover='';
}
function initCustom(){
  var now=performance.now();
  LAYOUTS.custom={rows:LAYOUTS[cur].rows.map(function(row){
    return {h:row.h,c:row.c.map(function(k){
      var s=slot(k),n=newSlot(s.label||s.name,s.fit);
      imgs[n]=imgs[k];cut[n]=cut[k];useCut[n]=useCut[k];view[n]={z:view[k].z,x:view[k].x,y:view[k].y};if(imgs[k])born[n]=now;
      return n;
    })};
  })};
  customInit=true;
}
function cellCount(){return LAYOUTS.custom.rows.reduce(function(a,r){return a+r.c.length},0)}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function changed(){syncEdit();buildCust();draw()}
function buildCust(){
  var box=$('crows'),rows=LAYOUTS.custom.rows;box.innerHTML='';
  rows.forEach(function(row,ri){
    var d=mk('div','crow'),top=mk('div','top');
    top.appendChild(mk('b','','Zeile '+(ri+1)));
    [1,2,3].forEach(function(n){
      var c=mk('button','chip'+(row.c.length===n?' on':''),String(n));
      c.title=n+(n===1?' Feld':' Felder');
      c.onclick=function(){
        var diff=n-row.c.length;
        if(diff>0&&cellCount()+diff>12){toast('Maximal 12 Felder');return}
        while(row.c.length>n)dropSlot(row.c.pop());
        while(row.c.length<n)row.c.push(newSlot('Feld '+(cellCount()+1)));
        changed();
      };
      top.appendChild(c);
    });
    var sl=mk('select');sl.title='Höhe';
    [[0.6,'Niedrig'],[1,'Normal'],[1.5,'Hoch'],[2,'Sehr hoch']].forEach(function(o){
      var op=mk('option','',o[1]);op.value=o[0];if(Math.abs(o[0]-row.h)<.01)op.selected=true;sl.appendChild(op);
    });
    sl.onchange=function(){row.h=parseFloat(sl.value);draw()};
    top.appendChild(sl);
    var x=mk('button','xb','×');x.title='Zeile entfernen';x.setAttribute('aria-label','Zeile entfernen');
    x.onclick=function(){
      if(rows.length<=1){toast('Mindestens eine Zeile');return}
      row.c.forEach(dropSlot);rows.splice(ri,1);changed();
    };
    top.appendChild(x);d.appendChild(top);
    row.c.forEach(function(k){
      var inp=mk('input');inp.type='text';inp.value=slot(k).label;inp.placeholder='Titel';inp.setAttribute('aria-label','Titel des Felds');
      inp.oninput=function(){var s=slot(k);s.label=s.name=inp.value;if(editKey===k)$('eName').textContent=inp.value;draw()};
      d.appendChild(inp);
    });
    box.appendChild(d);
  });
}
$('addRow').onclick=function(){
  var room=12-cellCount();
  if(room<=0){toast('Maximal 12 Felder');return}
  var n=Math.min(2,room),row={h:1,c:[]};
  for(var i=0;i<n;i++)row.c.push(newSlot('Feld '+(cellCount()+row.c.length+1)));
  LAYOUTS.custom.rows.push(row);changed();
};

/* Feld bearbeiten */
function syncEdit(){
  var el=$('edit');
  if(!sel||!imgs[sel]||!inLayout(sel)){el.hidden=true;editKey='';bgBuilt='';return}
  if(editKey!==sel){
    editKey=sel;
    el.hidden=false;el.style.animation='none';void el.offsetWidth;el.style.animation='';
    $('eName').textContent=slot(sel).name;
    seg('segFit',[['contain','Einpassen'],['cover','Füllen']],slot(sel).fit,function(v){
      slot(sel).fit=v;view[sel].z=1;view[sel].x=0;view[sel].y=0;syncEdit();draw();
    });
  }
  var z=Math.round(view[sel].z*100);
  $('zoom').value=z;$('eZ').textContent=z+' %';
  syncBg();
}
$('zoom').oninput=function(){if(!sel)return;view[sel].z=this.value/100;$('eZ').textContent=this.value+' %';draw()};
$('eView').onclick=function(){if(sel){resetView(sel);syncEdit();draw()}};
$('eRepl').onclick=function(e){if(sel){replaceKey=sel;pick(e.clientX,e.clientY)}};
function removeSel(){if(!sel)return;imgs[sel]=null;clearCut(sel);resetView(sel);sel='';syncEdit();draw()}
$('eDel').onclick=removeSel;
document.addEventListener('keydown',function(e){
  if(e.key==='Delete'&&sel&&e.target.tagName!=='INPUT')removeSel();
  if(e.key==='Escape'&&$('ov').classList.contains('on')){pending.shift();next(false)}
});

/* Hintergrund entfernen (lokal im Browser, @imgly/background-removal) */
var RB_URLS=['https://esm.sh/@imgly/background-removal@1.7.0','https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm'];
var rbCache={};
function getRB(i){
  if(rbCache[i])return rbCache[i];
  rbCache[i]=import(RB_URLS[i]).then(function(m){
    var f=m.removeBackground||m.default;
    if(typeof f!=='function')throw new Error('Export fehlt');
    return f;
  });
  rbCache[i].catch(function(){delete rbCache[i]});
  return rbCache[i];
}
function loadImg(url){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=url})}
function toBlobScaled(img,max){
  var sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(function(res){c.toBlob(res,'image/jpeg',.92)});
}
function setMsg(k,t){bgMsg[k]=t;if(sel===k)$('bgInfo').textContent=t}
function syncBg(){
  var k=sel,btn=$('bgBtn'),sg=$('segBg');
  $('bgInfo').textContent=bgMsg[k]||'';
  if(busy[k]){btn.hidden=false;btn.disabled=true;btn.textContent='Wird bearbeitet …';sg.hidden=true;bgBuilt='';return}
  btn.disabled=false;
  if(cut[k]){
    btn.hidden=true;sg.hidden=false;
    if(bgBuilt!==k){
      bgBuilt=k;
      seg('segBg',[['orig','Original'],['cut','Freigestellt']],useCut[k]?'cut':'orig',function(v){useCut[sel]=v==='cut';draw()});
    }
  }else{
    btn.hidden=false;btn.textContent='Hintergrund entfernen';sg.hidden=true;bgBuilt='';
  }
}
async function removeBg(k){
  var src=imgs[k];if(!src||busy[k])return;
  busy[k]=true;setMsg(k,'Bibliothek wird geladen …');syncEdit();
  var out=null,lastErr=null,models=['isnet_fp16','isnet_quint8'];
  try{
    var blob=await toBlobScaled(src,1600);
    for(var u=0;u<RB_URLS.length&&!out;u++){
      var rb;
      try{setMsg(k,'Bibliothek wird geladen (Quelle '+(u+1)+') …');rb=await getRB(u)}
      catch(e){lastErr=e;console.error('Import '+(u+1),e);continue}
      for(var m=0;m<models.length&&!out;m++){
        var cfg={model:models[m],device:'cpu',proxyToWorker:false,output:{format:'image/png'}};
        if(m===0)cfg.progress=function(key,cur,tot){
          if(String(key).indexOf('fetch')===0&&tot)setMsg(k,'Modell wird geladen … '+Math.round(cur/tot*100)+' %');
          else if(String(key).indexOf('compute')===0)setMsg(k,'Freistellen läuft …');
        };
        try{setMsg(k,'Modell wird geladen …');out=await rb(blob,cfg)}
        catch(e){lastErr=e;console.error('Quelle '+(u+1)+', Modell '+models[m],e)}
      }
    }
    if(!out)throw lastErr||new Error('Unbekannter Fehler');
    var im=await loadImg(URL.createObjectURL(out));
    if(imgs[k]===src){cut[k]=im;useCut[k]=true;born[k]=performance.now();bgMsg[k]=''}
  }catch(e){
    console.error(e);
    var st=(e&&e.stack?String(e.stack).split('\n').slice(0,3).join(' | ').slice(0,320):'');
    setMsg(k,'Fehlgeschlagen: '+(e&&e.name?e.name+' – ':'')+(e&&e.message?e.message:String(e))+(st?' ['+st+']':''));
  }
  busy[k]=false;syncEdit();draw();
}
$('bgBtn').onclick=function(){if(sel)removeBg(sel)};

/* Upload */
function icon(k){
  var s='<svg width="22" height="29" viewBox="0 0 24 32">',g=rects(cur,24,32,24/1800,1);
  g.c.forEach(function(c){
    var on=c.key===k;
    s+='<rect x="'+(c.x+.75)+'" y="'+(c.y+.75)+'" width="'+(c.w-1.5)+'" height="'+(c.h-1.5)+'" rx="1.5" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-opacity="'+(on?1:.35)+'" stroke-width="1.3"/>';
  });
  return s+'</svg>';
}
function readImg(f,ok,fail){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){ok({img:im,src:r.result,name:f.name})};im.onerror=fail;im.src=r.result};
  r.onerror=fail;r.readAsDataURL(f);
}
function addFiles(files){
  $('err').textContent='';
  var list=[].slice.call(files).filter(function(f){return f.type.indexOf('image/')===0||/\.(heic|heif)$/i.test(f.name)});
  if(!list.length)return;
  var left=list.length,loaded=[];
  list.forEach(function(f,idx){
    readImg(f,function(x){loaded[idx]=x;fin()},function(){
      $('err').textContent='"'+f.name+'" konnte nicht geladen werden (HEIC bitte als JPG/PNG).';fin()});
  });
  function fin(){
    if(--left)return;
    loaded.forEach(function(x){if(x)pending.push(x)});
    if(cur==='foto'&&pending.length===1&&!$('ov').classList.contains('on')){
      var it=pending.shift();setImg('photo',it.img);return;
    }
    if(!$('ov').classList.contains('on')){total=pending.length;next(true)}
  }
}
function next(first){
  if(!pending.length){$('ov').classList.remove('on');total=0;return}
  var it=pending[0],pv=$('pv');
  var apply=function(){
    pv.src=it.src;pv.classList.remove('sw');
    $('cnt').textContent=total>1?('Bild '+(total-pending.length+1)+' von '+total):'';
    var o=$('opts');o.innerHTML='';
    rects(cur,100,100,.05,1).c.forEach(function(c,i){
      var s=slot(c.key),b=document.createElement('button');b.className='opt';b.style.animationDelay=(80+i*55)+'ms';
      b.innerHTML=icon(c.key)+'<span>'+s.name+'<em>'+(imgs[c.key]?'ersetzen':s.sub)+'</em></span>';
      b.onclick=function(){setImg(c.key,it.img);pending.shift();next(false)};
      o.appendChild(b);
    });
  };
  if(first){apply();$('ov').classList.add('on')}
  else{pv.classList.add('sw');setTimeout(apply,reduce?0:200)}
}
$('skip').onclick=function(){pending.shift();next(false)};

var drop=$('drop'),file=$('file');
function pick(x,y){
  /* Menü braucht Platz nach unten, sonst verzerrt iPadOS es zum Kreis */
  file.style.left=Math.max(0,Math.min(innerWidth-320,x))+'px';
  file.style.top=Math.max(0,Math.min(innerHeight-340,y))+'px';
  file.click();
}
drop.onclick=function(e){replaceKey=null;pick(e.clientX,e.clientY)};
drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();replaceKey=null;var b=drop.getBoundingClientRect();pick(b.left+b.width/2,b.top+b.height/2)}};
file.onchange=function(){
  var fl=file.files;
  if(replaceKey&&fl[0]){
    var key=replaceKey;replaceKey=null;
    readImg(fl[0],function(x){setImg(key,x.img)},function(){$('err').textContent='Bild konnte nicht geladen werden.'});
  }else addFiles(fl);
  file.value='';
};
['dragover','dragenter'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(e){addFiles(e.dataTransfer.files)});
window.addEventListener('dragover',function(e){e.preventDefault()});
window.addEventListener('drop',function(e){e.preventDefault();if(e.target!==drop&&e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* Canvas: Hover, Auswahl, Ziehen, Zoom */
function cellAt(e){
  var r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*cv.width,py=(e.clientY-r.top)/r.height*cv.height;
  var g=rects(cur,cv.width,cv.height,cv.width/1800,2);
  for(var i=0;i<g.c.length;i++){var c=g.c[i];if(px>=c.x&&px<=c.x+c.w&&py>=c.y&&py<=c.y+c.h)return c}
  return null;
}
cv.onpointerdown=function(e){
  var c=cellAt(e);
  if(!c){sel='';syncEdit();draw();return}
  if(imgs[c.key]){
    sel=c.key;syncEdit();
    drag={k:c.key,px:e.clientX,py:e.clientY,vx:view[c.key].x,vy:view[c.key].y,moved:false};
    cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';draw();
  }
};
cv.onpointermove=function(e){
  if(drag){
    var r=cv.getBoundingClientRect(),s=cv.width/r.width,c=rects(cur,cv.width,cv.height,cv.width/1800,2).c.filter(function(x){return x.key===drag.k})[0];
    view[drag.k].x=Math.max(-1.5,Math.min(1.5,drag.vx+(e.clientX-drag.px)*s/c.w));
    view[drag.k].y=Math.max(-1.5,Math.min(1.5,drag.vy+(e.clientY-drag.py)*s/c.ih));
    draw();return;
  }
  var c=cellAt(e),k=c?c.key:'';
  cv.style.cursor=!c?'default':(imgs[k]?'grab':'pointer');
  if(k!==hover){hover=k;draw()}
};
cv.onpointerup=cv.onpointercancel=function(){drag=null;cv.style.cursor='default'};
cv.onmouseleave=function(){if(!drag){hover='';draw()}};
cv.onclick=function(e){var c=cellAt(e);if(c&&!imgs[c.key]){replaceKey=c.key;pick(e.clientX,e.clientY)}};
cv.addEventListener('wheel',function(e){
  var c=cellAt(e);if(!c||!imgs[c.key])return;
  e.preventDefault();
  var v=view[c.key];v.z=Math.max(.3,Math.min(4,v.z*Math.exp(-e.deltaY*0.0015)));
  if(sel!==c.key){sel=c.key}
  syncEdit();draw();
},{passive:false});

function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2200)}
$('title').oninput=draw;
$('reset').onclick=function(){SLOTS.forEach(function(s){imgs[s.key]=null;clearCut(s.key);resetView(s.key)});born={};sel='';syncEdit();draw()};
$('export').onclick=function(){
  var jpg=fmt==='jpg';
  render(size,false);
  cv.toBlob(function(b){
    var a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(cur==='foto'?'foto':'vinted-overview')+'.'+(jpg?'jpg':'png');
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},800);
    render(1000,true);draw();toast('Gespeichert ✓');
  },jpg?'image/jpeg':'image/png',0.93);
};
draw();
</script>
